<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LandVerifyCM Mobile QR</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #eef5ef;
        color: #10251a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 520px);
        padding: 28px;
        border: 1px solid #b7d4c0;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 45px rgba(13, 43, 28, 0.14);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      p {
        margin: 8px 0 18px;
        color: #62756a;
        line-height: 1.45;
      }

      img {
        width: min(72vw, 340px);
        height: min(72vw, 340px);
        image-rendering: pixelated;
        border: 10px solid #ddf6e7;
        border-radius: 18px;
      }

      code {
        display: block;
        margin-top: 18px;
        padding: 12px;
        border-radius: 12px;
        background: #edf6ef;
        color: #083d27;
        font-weight: 700;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open in Expo Go</h1>
      <p>Scan with Expo Go from any network. This code opens the tested Android and iOS release.</p>
      <img
        alt="Permanent Expo Go QR code for LandVerifyCM Mobile"
        src="https://qr.expo.dev/eas-update?projectId=02ae9725-cd6d-40ea-85cb-8011f7187d7e&amp;groupId=6ff327c6-a943-4954-bd15-347dbbc1b89a&amp;slug=exp"
      />
      <code>exp://u.expo.dev/02ae9725-cd6d-40ea-85cb-8011f7187d7e/group/6ff327c6-a943-4954-bd15-347dbbc1b89a</code>
    </main>
  </body>
</html>
